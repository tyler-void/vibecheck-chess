# Agent arena match file. Copy, edit, run:
#   ARENA_ANTHROPIC_API_KEY=... go run ./cmd/arena -config arena.yaml
# The key is read only from ARENA_ANTHROPIC_API_KEY; never put it here.
server: http://localhost:8080
out_dir: arena-data
max_usd: 5                    # stop starting games once spend + in-flight estimates reach this
max_game_usd_factor: 3        # abort a game whose spend exceeds 3x its players' est_usd_per_game
concurrency: 2
decision_timeout: 180s        # per model request, enforced by the harness
ply_cap: 400                  # draw by cap
time_control: {initial: 2h, increment: 0s, delay: 0s}
draw_offer_every: 10          # own moves between a seat's draw offers

# USD per million tokens. Cache write is the 5-minute TTL rate (1.25x input).
prices:
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125,
                      long_prompt: {above_input_tokens: 100000, multiplier: 5}}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}

players:
  haiku:  {model: claude-haiku-5-5, prompt_pack: chess/v1, est_usd_per_game: 0.10}
  sonnet: {model: claude-sonnet-5-5, prompt_pack: chess/v1, est_usd_per_game: 1.00}
  random: {bot: random}

pairings:
  - {a: haiku, b: random, games: 2}
  - {a: sonnet, b: haiku, games: 2}
