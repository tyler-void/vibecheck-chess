# nginx config for the kisschess US5 proxy-survival smoke test.
#
# Verifies the production-deploy path documented in
# specs/001-kiss-chess-engine/quickstart.md (manual pre-release smoke).
# NOT run in CI — see the U2 remediation veto on docker-compose-in-CI.
#
# Reverse-proxies a single upstream kisschess on 127.0.0.1:8081 over
# HTTP/2 (TLS terminated here). Uses a self-signed cert generated by
# the smoke procedure on first run.
#
# The four things this config gets right (and that any proxy in front
# of an SSE service MUST get right):
#
#   1. proxy_buffering off      — events flush to the client immediately.
#   2. proxy_read_timeout 30s   — short enough to fail-fast if our 15s
#                                  ping cadence is broken.
#   3. proxy_http_version 1.1   — long-lived upstream connections;
#                                  keep-alive Connection header preserved.
#   4. gzip off (for SSE)       — gzip with flush-after-write is fine for
#                                  modern nginx, but disabling it is the
#                                  conservative default.
#
# HTTP/2 on the client edge is mandatory: HTTP/1.1's 6-connections-
# per-origin browser cap is fatal at 10k CCU (research.md R-18).

worker_processes auto;
events {
    worker_connections 4096;
}

http {
    # Maintain a small pool of upstream connections so the SSE handshake
    # doesn't pay a TCP setup cost on every reconnect.
    upstream kisschess {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    # MIME so static assets serve correctly.
    types {
        text/event-stream  sse;
        application/javascript js;
        text/css css;
    }
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    server {
        listen 443 ssl;
        http2 on;

        # Smoke-test self-signed cert. Generate before the docker run:
        #   openssl req -x509 -newkey rsa:2048 -nodes -days 7 \
        #     -keyout deploy/key.pem -out deploy/cert.pem \
        #     -subj "/CN=localhost"
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # ---------------- SSE endpoint ----------------
        # Everything under /games/*/sse needs the streaming-safe knobs.
        location ~ ^/games/.+/sse$ {
            proxy_pass                 http://kisschess;

            proxy_http_version         1.1;
            proxy_set_header           Connection        '';
            proxy_set_header           Host              $host;
            proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header           X-Forwarded-Proto $scheme;

            # The streaming-safe trio. proxy_buffering off is the one that
            # most reverse-proxy outages trace to.
            proxy_buffering            off;
            proxy_cache                off;
            gzip                       off;

            # 30s is short enough to fail-fast if our 15s : ping cadence
            # ever regresses. Production may want longer (~120s) for tail
            # latency tolerance, but for the smoke test, short is correct.
            proxy_read_timeout         30s;
            proxy_send_timeout         30s;

            # Forward Last-Event-ID on reconnect.
            proxy_set_header           Last-Event-ID     $http_last_event_id;
        }

        # ---------------- Everything else ----------------
        # Game-creation, /move, /resign, /draw-offer, /healthz, /static.
        # Plain HTTP/1.1 reverse proxy with standard knobs.
        location / {
            proxy_pass                 http://kisschess;
            proxy_http_version         1.1;
            proxy_set_header           Host              $host;
            proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header           X-Forwarded-Proto $scheme;
        }
    }
}
